  <script>
    (function () {
      try {
        var t = localStorage.getItem('vezham-theme');
        if (!t) { t = 'dark'; localStorage.setItem('vezham-theme', 'dark'); }
        var isLight = t === 'light';
        document.documentElement.classList.add(isLight ? 'light' : 'dark');
        document.documentElement.classList.remove(isLight ? 'dark' : 'light');
        document.body.style.backgroundColor = isLight ? '#f5f5f0' : '#09090b';
      } catch (e) { }
    })();
  </script>
